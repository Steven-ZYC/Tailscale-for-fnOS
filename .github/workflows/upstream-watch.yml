name: Track Tailscale stable releases

on:
  schedule:
    - cron: "17 1 * * *"
    # Retry the same idempotent check three hours after the primary run. When
    # the primary succeeds this is a cheap no-op; when it fails this recovers
    # without keeping a runner asleep for three hours.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: tailscale-upstream-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Prepare executable scripts
        run: chmod +x scripts/*.sh packaging/cmd/* packaging/app/ui/index.cgi

      - name: Compare official stable versions
        id: version
        shell: bash
        run: |
          source upstream.lock
          latest="$(./scripts/detect-upstream.sh --version-only)"
          echo "current=${TAILSCALE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$TAILSCALE_VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update pinned version and checksums
        if: steps.version.outputs.changed == 'true'
        run: ./scripts/update-upstream-lock.sh "${{ steps.version.outputs.latest }}"

      - name: Validate the candidate update
        if: steps.version.outputs.changed == 'true'
        run: |
          ./scripts/validate.sh
          ./scripts/install-fnpack.sh
          ./scripts/build-all.sh

      - name: Open or refresh an update pull request
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.version.outputs.latest }}
        shell: bash
        run: |
          branch="automation/tailscale-v${LATEST}"

          existing_pr="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$branch" \
            --json url \
            --jq '.[0].url // ""')"
          if [ -n "$existing_pr" ]; then
            echo "Update pull request already exists: $existing_pr"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- upstream.lock
          # Keep the automation identity as the committer for auditability, but
          # attribute the authored repository change to the project maintainer.
          # GitHub's Contributors view counts authors, not committers.
          git commit \
            --author="Steven-ZYC <60809224+Steven-ZYC@users.noreply.github.com>" \
            -m "chore: update Tailscale to v${LATEST}"

          remote_sha="$(git ls-remote --heads origin "refs/heads/${branch}" | awk '{print $1}')"
          if [ -n "$remote_sha" ]; then
            echo "Refreshing update branch left by an earlier failed run: $branch"
            git push \
              --force-with-lease="refs/heads/${branch}:${remote_sha}" \
              origin "HEAD:refs/heads/${branch}"
          else
            git push --set-upstream origin "$branch"
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "chore: update Tailscale to v${LATEST}" \
            --body "Automated stable-channel update. Official amd64 and arm64 checksums were refreshed, and both FPK packages built successfully before this pull request was opened."

      - name: Report current status
        if: always()
        run: |
          echo "Run:     ${{ github.event.schedule == '17 4 * * *' && 'three-hour retry' || 'primary/manual check' }}"
          echo "Current: ${{ steps.version.outputs.current }}"
          echo "Latest:  ${{ steps.version.outputs.latest }}"

      - name: Close a recovered automation incident
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search '"[automation] Tailscale stable update failed" in:title' \
            --json number,title \
            --jq '.[] | select(.title == "[automation] Tailscale stable update failed") | .number' \
            | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "Recovered in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          fi

      - name: Record an automation incident
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_KIND: ${{ github.event.schedule == '17 4 * * *' && 'three-hour retry' || 'primary/manual check' }}
        shell: bash
        run: |
          title="[automation] Tailscale stable update failed"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="The ${RUN_KIND} failed at $(date -u +'%Y-%m-%d %H:%M:%S UTC').

          Full error log: ${run_url}

          The scheduled primary run is followed by an idempotent retry three hours later. If this was already the retry, maintainer action is required."
          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"${title}\" in:title" \
            --json number,title \
            --jq '.[] | select(.title == "[automation] Tailscale stable update failed") | .number' \
            | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
