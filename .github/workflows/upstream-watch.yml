name: Track Tailscale stable releases

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tailscale-upstream-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Prepare executable scripts
        run: chmod +x scripts/*.sh packaging/cmd/* packaging/app/ui/index.cgi

      - name: Compare official stable versions
        id: version
        shell: bash
        run: |
          source upstream.lock
          latest="$(./scripts/detect-upstream.sh --version-only)"
          echo "current=${TAILSCALE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$TAILSCALE_VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update pinned version and checksums
        if: steps.version.outputs.changed == 'true'
        run: ./scripts/update-upstream-lock.sh "${{ steps.version.outputs.latest }}"

      - name: Validate the candidate update
        if: steps.version.outputs.changed == 'true'
        run: |
          ./scripts/validate.sh
          ./scripts/install-fnpack.sh
          ./scripts/build-all.sh

      - name: Open an update pull request
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.version.outputs.latest }}
        shell: bash
        run: |
          branch="automation/tailscale-v${LATEST}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Update branch already exists: $branch"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- upstream.lock
          git commit -m "chore: update Tailscale to v${LATEST}"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: update Tailscale to v${LATEST}" \
            --body "Automated stable-channel update. Official amd64 and arm64 checksums were refreshed, and both FPK packages built successfully before this pull request was opened."

      - name: Report current status
        run: |
          echo "Current: ${{ steps.version.outputs.current }}"
          echo "Latest:  ${{ steps.version.outputs.latest }}"
