name: Build fnOS release

on:
  push:
    branches: [main]
    paths:
      - upstream.lock
      - packaging/**
      - cmd/**
      - internal/**
      - go.mod
      - scripts/**
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release after a successful manual build
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: fnos-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Prepare executable scripts
        run: chmod +x scripts/*.sh packaging/cmd/* packaging/app/ui/index.cgi

      - name: Read release identity
        id: release
        shell: bash
        run: |
          source upstream.lock
          package_version="${TAILSCALE_VERSION}-fnos.${FNOS_PACKAGE_REVISION}"
          echo "package_version=${package_version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${package_version}" >> "$GITHUB_OUTPUT"

      - name: Skip an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if gh release view "$TAG" --json isDraft --jq '.isDraft' | grep -q '^true$'; then
              echo "draft=true" >> "$GITHUB_OUTPUT"
            else
              echo "draft=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate and build
        run: |
          ./scripts/validate.sh
          ./scripts/install-fnpack.sh
          ./scripts/build-all.sh
          ./scripts/create-release-notes.sh

      - name: Upload FPK workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tailscale-fnos-${{ steps.release.outputs.package_version }}
          path: |
            dist/*.fpk
            dist/SHA256SUMS
            dist/provenance.json
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30

      - name: Attest FPK build provenance
        if: steps.existing.outputs.exists != 'true'
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.fpk

      - name: Create GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        shell: bash
        run: |
          release_state=(--draft)
          if [ "$PUBLISH" = "true" ]; then
            release_state=()
          fi
          gh release create "$TAG" \
            "${release_state[@]}" \
            --target "$GITHUB_SHA" \
            --title "Tailscale for fnOS ${PACKAGE_VERSION}" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/*.fpk \
            dist/SHA256SUMS \
            dist/provenance.json

      - name: Publish an existing tested draft
        if: steps.existing.outputs.draft == 'true' && (github.event_name == 'push' || inputs.publish == true)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
